<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); }
    button { background: var(--tg-theme-button-color, #0088cc); color: var(--tg-theme-button-text-color, #fff); border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; }
  </style>
</head>
<body>
  <h2 id="hello">جارٍ التحميل...</h2>
  <p id="info"></p>
  <button onclick="sendData()">إرسال بيانات للبوت</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const user = tg.initDataUnsafe?.user;
    if (user) {
      document.getElementById("hello").textContent = "أهلاً " + user.first_name;
      document.getElementById("info").textContent = "ID: " + user.id;
    } else {
      document.getElementById("hello").textContent = "افتح التطبيق من داخل Telegram";
    }

    function sendData() {
      tg.sendData(JSON.stringify({ action: "hello", time: Date.now() }));
      tg.close();
    }
  </script>
</body>
</html>
