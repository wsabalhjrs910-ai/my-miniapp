<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تطبيقي المصغر</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); }
    button { padding: 10px 20px; background: var(--tg-theme-button-color, #007bff); color: var(--tg-theme-button-text-color, #fff); border: none; border-radius: 5px; margin-top: 20px; cursor: pointer;}
  </style>
</head>
<body>
  <h2>تطبيقي المصغر</h2>
  <p>قم بتسجيل الدخول إلى التطبيق من داخل Telegram</p>
  <button onclick="sendData()">إرسال البيانات للبوت</button>
  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    function sendData() {
      tg.sendData(JSON.stringify({ action: "test" }));
      tg.close();
    }
  </script>
</body>
</html>
